    <!-- Critical CSS: 登录页骨架 + 基础变量（避免 FOUC） -->

    :root{--primary:#1677ff;--primary-hover:#4096ff;--bg-body-fallback:#f5f5f5;--bg-body:linear-gradient(135deg,#f5f5f5 0%,#fafafa 50%,#f0f0f0 100%);--text-primary:rgba(0,0,0,.88);--border:#d9d9d9;--space-2:8px;--space-4:16px;--space-5:20px;--space-8:32px;--rounded-md:6px;--rounded-2xl:16px;--glass-shadow:0 6px 16px 0 rgba(0,0,0,.08),0 3px 6px -4px rgba(0,0,0,.12),0 9px 28px 8px rgba(0,0,0,.05)}

    <script>
    window.__fastbeeAssetVersion = '20260519-1822';
    window.__fastbeeResolveAssetUrl = function(path) {
        var separator = path.indexOf('?') === -1 ? '?' : '&';
        return path + separator + 'v=' + window.__fastbeeAssetVersion;
    };
    // One browser-wide queue keeps all text assets within the single-stream
    // budget used by no-PSRAM targets.  The short settle window gives the
    // device time to process TCP close/onDisconnect before the next request.
    window.__fastbeeStaticAssetChain = Promise.resolve();
    window.__fastbeeQueueStaticAsset = function(task) {
        var previous = window.__fastbeeStaticAssetChain || Promise.resolve();
        var run = previous.catch(function() {}).then(function() { return task(); });
        function settle() {
            return new Promise(function(resolve) { setTimeout(resolve, 100); });
        }
        window.__fastbeeStaticAssetChain = run.then(settle, settle);
        return run;
    };
    var fastbeeBootNonce = document.currentScript ? document.currentScript.nonce : '';
    window.__fastbeeFetchAssetBody = async function(url, type) {
        var c = new AbortController(), r, body;
        var t = setTimeout(function() { c.abort(); }, 8000);
        try {
            r = await fetch(url, { signal: c.signal, credentials: 'same-origin', mode: 'same-origin' });
            if (!r.ok) throw new Error('Asset HTTP ' + r.status);
            if (type === 'text' && !/^(application|text)\/(x-)?(java|ecma)script$/.test((r.headers.get('Content-Type') || '').split(';')[0].trim().toLowerCase())) throw new Error('Invalid script MIME');
            body = await r[type]();
            if (c.signal.aborted) throw new Error('Asset download expired');
            return body;
        } catch (e) {
            c.abort();
            if (r && r.body && !r.body.locked) { try { await r.body.cancel(); } catch (_) {} }
            throw e;
        } finally { clearTimeout(t); }
    };
    window.__fastbeeFetchBootScript = async function(url) {
        var source = await window.__fastbeeFetchAssetBody(url, 'text');
        var s = document.createElement('script'), error;
        function capture(e) { error = e.error instanceof Error ? e.error : new Error(e.message); }
        if (fastbeeBootNonce) s.nonce = fastbeeBootNonce;
        s.textContent = source;
        window.addEventListener('error', capture);
        try {
            document.head.appendChild(s);
            if (error) throw error;
        } catch (e) { e.bootExecutionStarted = true; throw e; }
        finally { window.removeEventListener('error', capture); s.remove(); }
    };
    // Images share the text/API transport queue too. Cache the completed blob
    // so showing the same logo in the sidebar cannot open another connection.
    window.__fastbeeImageAssets = Object.create(null);
    window.__fastbeeLoadImageAsset = function(element, path) {
        if (!element || !path) return Promise.resolve();
        var assets = window.__fastbeeImageAssets;
        if (!assets[path]) {
            assets[path] = window.__fastbeeQueueStaticAsset(async function() {
                return URL.createObjectURL(await window.__fastbeeFetchAssetBody(window.__fastbeeResolveAssetUrl(path), 'blob'));
            }).catch(function(error) {
                delete assets[path];
                throw error;
            });
        }
        return assets[path].then(function(url) {
            element.setAttribute(element.tagName === 'LINK' ? 'href' : 'src', url);
        });
    };
    </script>

    <!-- Fetch boot chunks serially; execute only complete, valid downloads. -->
    <script>
    (function() {
        var bootChunks = [
            './js/chunk-1-core.js',
            './js/chunk-2-app.js',
            './js/chunk-3-state.js'
        ];
        var started = false;
        var CHUNK_MAX_RETRY = 4; // 弱网/退化链路下单次加载失败率高，重试大幅提升成功率
        function loadSequence(files, delayMs, onDone) {
            var i = 0;
            function loadNext() {
                if (i >= files.length) {
                    if (typeof onDone === 'function') onDone(true);
                    return;
                }
                var baseUrl = window.__fastbeeResolveAssetUrl(files[i]);
                var attempt = 0;
                function tryLoad() {
                    window.__fastbeeQueueStaticAsset(function() {
                        return window.__fastbeeFetchBootScript(baseUrl + (attempt > 0 ? '&r=' + attempt : ''));
                    }).then(function() {
                        i++;
                        setTimeout(loadNext, delayMs || 30);
                    }, function(error) {
                        attempt++;
                        if (attempt < CHUNK_MAX_RETRY && !error.bootExecutionStarted) {
                            // 递增退避：300/1200/2700ms，更快恢复且不压床设备
                            setTimeout(tryLoad, 300 * attempt * attempt);
                        } else {
                            console.error('[FastBee] chunk giving up:', files[i]);
                            window.__fastbeeChunkGaveUp = true; // E2E 测试断言：正常网络下不应出现
                            if (typeof onDone === 'function') onDone(false);
                        }
                    });
                }
                tryLoad();
            }
            setTimeout(loadNext, 20);
        }
        function startChunkLoad() {
            if (started) return;
            started = true;
            ['login-logo', 'fb-favicon'].forEach(function(id) {
                var element = document.getElementById(id);
                if (element) window.__fastbeeLoadImageAsset(element, element.getAttribute('data-asset-src'))
                    .catch(function(error) { console.warn('[FastBee] Optional image unavailable:', error.message); });
            });
            loadSequence(bootChunks, 30);
        }
        window.__fastbeeStartChunks = startChunkLoad;
        window.__fastbeeLoadZhChunks = function(cb) { if (cb) cb(true); };
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startChunkLoad, { once: true });
        } else {
            startChunkLoad();
        }
    })();
    </script>
    <script>
    (function() {
        function setSubmitState(submitBtn, isLoading, text) {
            if (!submitBtn) return;
            submitBtn.disabled = !!isLoading;
            if (typeof text === 'string') submitBtn.innerHTML = text;
        }

        function inlineLoginFallback(originalText, submitBtn) {
            var usernameEl = document.getElementById('username');
            var passwordEl = document.getElementById('password');
            var rememberEl = document.getElementById('remember');
            var username = usernameEl ? usernameEl.value : '';
            var password = passwordEl ? passwordEl.value : '';
            var remember = rememberEl ? !!rememberEl.checked : false;

            if (!username || !password) {
                setSubmitState(submitBtn, false, originalText);
                return;
            }

            setSubmitState(submitBtn, true, '登录中...');
            // Keep fallback login within the shared transport budget.
            window.__fastbeeQueueStaticAsset(function() {
                var controller = new AbortController();
                var timer = setTimeout(function() { controller.abort(); }, 15000);
                return fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    credentials: 'include',
                    cache: 'no-store',
                    signal: controller.signal,
                    body: 'username=' + encodeURIComponent(username) + '&password=' + encodeURIComponent(password)
                }).then(function(resp) {
                    return resp.json().then(function(data) {
                        if (!resp.ok || !data || !data.success) {
                            throw new Error((data && data.error) || 'login failed');
                        }
                        return data;
                    });
                }).finally(function() { clearTimeout(timer); });
            }).then(function(data) {
                localStorage.removeItem('auth_token');
                localStorage.removeItem('sessionId');
                if (remember) {
                    localStorage.setItem('remember', 'true');
                    localStorage.setItem('username', username);
                    // WP-13: 不再保存密码到 localStorage
                } else {
                    ['remember', 'username', 'password'].forEach(function(key) {
                        localStorage.removeItem(key);
                    });
                }
                location.replace(window.__fastbeeResolveAssetUrl('/'));
            }).catch(function(err) {
                console.error('[FastBee] inline login fallback failed:', err);
                setSubmitState(submitBtn, false, originalText);
            });
        }

        function waitForBootAndLogin(deadline, originalText, submitBtn) {
            if (window.__fastbeeBootReady && window.AppState && typeof window.AppState.handleLogin === 'function') {
                setSubmitState(submitBtn, false, originalText);
                window.AppState.handleLogin();
                return;
            }
            if (window.__fastbeeChunkGaveUp || Date.now() >= deadline) {
                console.warn('[FastBee] boot not ready before login submit timeout');
                inlineLoginFallback(originalText, submitBtn);
                return;
            }
            setTimeout(function() {
                waitForBootAndLogin(deadline, originalText, submitBtn);
            }, 150);
        }

        // Exhausted boot downloads enter the queued login fallback immediately.
        var bootLoginWaitMs = 15000;

        function installLoginBootGuard() {
            var loginForm = document.getElementById('login-form');
            if (!loginForm) return;
            loginForm.addEventListener('submit', function(e) {
                if (window.__fastbeeBootReady && window.AppState && typeof window.AppState.handleLogin === 'function') {
                    return;
                }
                e.preventDefault();
                if (typeof window.__fastbeeStartChunks === 'function') {
                    window.__fastbeeStartChunks();
                }
                var submitBtn = loginForm.querySelector('button[type="submit"]');
                var originalText = submitBtn ? submitBtn.innerHTML : '';
                setSubmitState(submitBtn, true, '页面初始化中...');
                waitForBootAndLogin(Date.now() + bootLoginWaitMs, originalText, submitBtn);
            }, true);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', installLoginBootGuard, { once: true });
        } else {
            installLoginBootGuard();
        }
    })();
    </script>
    <!-- Service Worker 注册：延迟到页面完全加载后 5 秒，避免与初始 API 请求叠加压床 ESP32 -->
    <script>
    (function() {
        if (!('serviceWorker' in navigator)) return;

        // 先尝试卸载所有旧的 SW
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
            registrations.forEach(function(reg) {
                console.log('[FastBee] Unregistering old SW:', reg.scope);
                reg.unregister();
            });
        }).catch(function(err) {
            console.warn('[FastBee] Failed to unregister old SW:', err);
        });

        setTimeout(function() {
            var version = window.__fastbeeAssetVersion || 'dev';
            try {
                var key = 'fastbeeAssetVersion';
                var previous = localStorage.getItem(key) || '';
                localStorage.setItem(key, version);
                if (previous && previous !== version && window.caches) {
                    caches.keys().then(function(names) {
                        return Promise.all(names.filter(function(name) {
                            return name.indexOf('fastbee-') === 0;
                        }).map(function(name) {
                            return caches.delete(name).catch(function() { return false; });
                        }));
                    }).catch(function() {});
                }
            } catch (_) {}
            var registerWorker = function() {
                return navigator.serviceWorker.register(window.__fastbeeResolveAssetUrl('/sw.js'));
            };
            var registration = typeof window.__fastbeeQueueStaticAsset === 'function'
                ? window.__fastbeeQueueStaticAsset(registerWorker)
                : registerWorker();
            registration.catch(function(err) {
                console.warn('[FastBee] service worker register failed:', err);
            });
        }, 5000);
    })();
    </script>
