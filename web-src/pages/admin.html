<!-- 用户管理页面 -->
<div id="users-page" class="page page-layout-flat">
    <div class="fb-card">
        <div class="fb-card-header u-header-between">
            <h2 class="fb-card-title" id="users-title">用户管理</h2>
            <div class="u-toolbar-sm">
                <button class="fb-btn fb-btn-refresh" id="users-refresh-btn"><span>刷新</span></button>
                <button class="fb-btn fb-btn-primary" id="add-user-btn">
                    添加用户
                </button>
            </div>
        </div>
        <div class="fb-card-body">
            <div class="u-table-wrap">
                <table class="fb-table fb-table-bordered u-table-fill">
                    <thead>
                        <tr>
                            <th id="user-username-col">用户名</th>
                            <th id="user-lastlogin-col">最后登录</th>
                            <th id="user-status-col">状态</th>
                            <th id="user-desc-col">描述</th>
                            <th id="user-actions-col">操作</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body">
                        <!-- 用户数据将通过JS动态生成 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
