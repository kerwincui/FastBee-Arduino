<!-- 规则脚本页面 -->
<div id="rule-script-page" class="page page-layout-flat">
    <div class="fb-card">
        <div class="fb-card-header fb-card-header-toolbar fb-data-toolbar">
            <div class="fb-data-toolbar-leading">
                <span id="rule-script-list-summary" class="fb-data-toolbar-summary" role="status" aria-live="polite">加载中...</span>
            </div>
            <div class="fb-card-header-actions">
                <button class="fb-btn fb-btn-refresh" id="rule-script-refresh-btn"><span>刷新</span></button>
                <button class="fb-btn fb-btn-primary" data-action="openRuleScriptModal">
                    <span>新增规则</span>
                </button>
            </div>
        </div>
        <div id="rule-script-dev-mode-hint" class="u-hint-bar u-hint-bar-warning developer-mode-hint" style="display:none">
            <span>开发环境已禁用，请到设备配置的高级配置中启用后再修改。</span>
        </div>
        <div class="fb-card-body">
            <div class="u-table-wrap">
                <table class="fb-table fb-table-bordered u-table-fill">
                    <thead>
                        <tr>
                            <th>名称</th>
                            <th style="width:92px;">状态</th>
                            <th>触发方式</th>
                            <th>协议类型</th>
                            <th>主题映射</th>
                            <th>统计</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="rule-script-table-body">
                        <tr>
                            <td colspan="7" class="u-empty-cell">加载中...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
