<!-- WiFi选择弹窗 -->
<div id="wifi-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="wifi-modal-title">
    <div class="modal-content u-modal-content-560">
        <div class="modal-header">
            <h2 class="modal-title" id="wifi-modal-title">选择WiFi网络</h2>
            <button id="close-wifi-modal" class="modal-close-btn">×</button>
        </div>
        <div id="wifi-modal-body" class="modal-body modal-body-compact u-min-h-120">
            <!-- 扫描结果动态加载 -->
        </div>
    </div>
</div>

<!-- 修改密码模态窗 -->
<div id="change-password-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="change-password-title">
    <div class="modal-content">
        <div class="modal-header">
            <h2 class="modal-title" id="change-password-title">修改密码</h2>
            <button id="close-password-modal" class="modal-close-btn">×</button>
        </div>
        <div class="modal-body">
            <form id="change-password-form" class="fb-form">
                <fieldset>
                    <div class="fb-form-group">
                        <label for="current-password-input" id="current-password-label">当前密码</label>
                        <input type="password" id="current-password-input" class=""
                            placeholder="请输入当前密码" required>
                    </div>

                    <div class="fb-form-group">
                        <label for="new-password-input" id="new-password-label">新密码</label>
                        <input type="password" id="new-password-input" class="" placeholder="请输入新密码"
                            required>
                    </div>

                    <div class="fb-form-group">
                        <label for="confirm-password-input" id="confirm-password-label">确认新密码</label>
                        <input type="password" id="confirm-password-input" class=""
                            placeholder="请再次输入新密码" required>
                    </div>

                    <div id="password-error" class="message message-error is-hidden"></div>
                </fieldset>
            </form>
        </div>
        <div class="modal-footer">
            <button class="fb-btn" id="cancel-password-btn" type="button">取消</button>
            <button class="fb-btn fb-btn-primary" id="confirm-password-btn" type="button">确认修改</button>
        </div>
    </div>
</div>

<!-- 外设执行模态窗 -->
<div id="periph-exec-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="periph-exec-modal-title">
    <div class="modal-content u-modal-content-900">
        <div class="modal-header">
            <h2 class="modal-title" id="periph-exec-modal-title">新增外设执行</h2>
            <button id="close-periph-exec-modal" class="modal-close-btn">&times;</button>
        </div>
        <div class="modal-body">
            <form id="periph-exec-form" class="fb-form">
                <fieldset>
                    <input type="hidden" id="periph-exec-original-id" value="">
                    <details id="pe-template-wizard" class="u-note-card u-mb-15 is-hidden">
                        <summary>从只读采集模板开始（新增规则）</summary>
                    </details>

                    <!-- 第一部分：基础配置 -->
                    <div class="pe-base-grid">
                        <div class="fb-form-group pe-base-name">
                            <label for="periph-exec-name">规则名称</label>
                            <input type="text" id="periph-exec-name" class=""
                                placeholder="例如：温度过高报警、每天采集环境数据" required>
                        </div>
                        <label class="fb-checkbox pe-rule-enabled"><input type="checkbox" id="periph-exec-enabled" checked><span>启用规则</span></label>
                    </div>
                    <div class="pe-rule-options" aria-label="数据与屏幕">
                        <label class="fb-checkbox" title="执行完成后向平台上报设备数据"><input type="checkbox" id="periph-exec-report" checked><span>执行后上报数据</span></label>
                        <label class="fb-checkbox" title="添加采集或读取动作后可开启，用于数值趋势"><input type="checkbox" id="periph-exec-record-history" disabled><span>保留最近 10 条记录</span></label>
                        <label class="fb-checkbox" title="允许设备屏幕调用此规则中支持的安全动作"><input type="checkbox" id="periph-exec-panel-control"><span>允许设备屏幕控制</span></label>
                        <button id="periph-exec-history-settings-link" type="button" class="fb-btn fb-btn-sm fb-btn-link" title="在新标签页管理记录，保留当前编辑内容">管理最近记录 ↗</button>
                    </div>
                    <p class="u-help">记录用于数值趋势；屏幕控制仅开放规则支持的动作。管理记录会打开新标签页，保留当前编辑。</p>

                    <!-- 第二部分：触发配置 (动态多组) -->
                    <div id="periph-exec-risk-note" class="u-note-card u-note-card-warning u-mb-15 is-hidden"></div>
                    <div class="section-title section-title-actions">
                        <span>触发配置</span>
                        <button type="button" class="fb-btn fb-btn-sm" data-action="addPeriphExecTrigger">
                            添加触发
                        </button>
                    </div>
                    <div id="periph-exec-triggers">
                        <!-- 动态触发配置块将在此渲染 -->
                    </div>

                    <!-- 第三部分：执行动作配置 (动态多组) -->
                    <div class="section-title section-title-actions">
                        <span>执行动作配置</span>
                        <button type="button" class="fb-btn fb-btn-sm" data-action="addPeriphExecAction">
                            添加动作
                        </button>
                    </div>
                    <div id="periph-exec-actions">
                        <!-- 动态执行动作配置块将在此渲染 -->
                    </div>

                    <div id="periph-exec-error" class="message message-error is-hidden"></div>
                </fieldset>
            </form>
        </div>
        <div class="modal-footer">
            <button class="fb-btn" id="cancel-periph-exec-btn" type="button">取消</button>
            <button class="fb-btn fb-btn-primary" id="save-periph-exec-btn" type="button">保存</button>
        </div>
    </div>
</div>
