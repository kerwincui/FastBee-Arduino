name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# 同时只跑一个 CI，避免 Windows 文件锁与 .pio 缓存竞态
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============ Job 1: 测试注册校验（秒级，快速失败门） ============
  validate-coverage:
    name: Validate Test Registration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate test registration (RUN_TEST coverage)
        run: node scripts/validate-test-coverage.js

  # ============ Job 2: Native 单元测试（~5 分钟） ============
  native-tests:
    name: Native Unit Tests (2282+ cases)
    runs-on: ubuntu-latest
    needs: validate-coverage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio
      - name: Run native tests
        run: pio test -e native

  # ============ Job 3: 固件编译验证（ESP32 经典芯片） ============
  firmware-build:
    name: Firmware Build (esp32-F4R0)
    runs-on: ubuntu-latest
    needs: validate-coverage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio
      - name: Build firmware
        run: pio run -e esp32-F4R0
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32-F4R0
          path: |
            .pio/build/esp32-F4R0/firmware.bin
            .pio/build/esp32-F4R0/firmware.factory.bin
          retention-days: 14

  # ============ Job 4: 前端构建验证 ============
  web-build:
    name: Web Module Build
    runs-on: ubuntu-latest
    needs: validate-coverage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
      - name: Build web modules
        run: node scripts/build-web-modules.js
      - name: Verify LittleFS staging
        run: |
          test -f data/www/index.html
          test -f data/www/js/chunk-1-core-a.js
          test -f data/www/js/modules/i18n-zh-CN.js
          test -f data/www/js/modules/i18n-en.js

  # ============ Job 5: 静态门禁 (不依赖设备) ============
  static-validation:
    name: Static Validation
    runs-on: ubuntu-latest
    needs: validate-coverage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Validate build matrix consistency
        run: node scripts/validate-build-matrix.js
      - name: Validate documentation links
        run: node scripts/validate-doc-links.js
      - name: Validate config defaults
        run: node scripts/validate-config-defaults.js
      - name: Validate i18n completeness
        run: node scripts/validate-i18n.js
      - name: Validate file sizes (build artifacts)
        run: node scripts/validate-file-sizes.js
      - name: Validate test registration and coverage
        run: node scripts/validate-test-coverage.js
      - name: Validate MQTT/NTP lifecycle
        run: node scripts/validate-mqtt-ntp-lifecycle.js
      - name: Validate RuleScript profile consistency
        run: node scripts/validate-rule-script-profile.js
      - name: Validate third-party library patches (AsyncTCP/ESPAsyncWebServer)
        run: node scripts/validate-libdeps-patches.js
      - name: Validate feature budget metadata alignment (WP-92)
        run: node scripts/validate-feature-budgets.js
      - name: Validate FIM manifest consistency (WP-95)
        run: node scripts/validate-fim-manifest.js --fim-dir=./test/fim-test
      - name: Validate generic architecture (no device-specific hardcoding)
        run: node scripts/validate-generic-architecture.js

# E2E 测试需真实 ESP32 设备，不在 CI 自动触发。
# 可通过 workflow_dispatch 手动触发（需配置设备 IP/串口）。
