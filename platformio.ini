; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-F4R0

[esp32_base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
framework = arduino
build_type = release
board_build.filesystem = littlefs
board_build.partitions = partitions/16MB.csv
extra_scripts = 
	pre:scripts/apply-libdeps-patches.py
	pre:scripts/kill-stale-processes.py
	pre:scripts/fastbee-artifacts.py
	post:scripts/fastbee-artifacts.py
	post:scripts/prepare-rgb-iram.py
lib_deps = 
	bblanchon/ArduinoJson @ 7.4.2
	knolleary/PubSubClient @ 2.8.0
	olikraus/U8g2 @ 2.36.18
	adafruit/DHT sensor library @ 1.4.7
	adafruit/Adafruit Unified Sensor @ 1.1.15
	; Use the registry release so clean CI/builds do not depend on a GitHub clone
	; being available. C6 GPIO compatibility is normalized by the pre-build hook.
	paulstoffregen/OneWire @ 2.3.8
	milesburton/DallasTemperature @ 3.11.0
	ESP32Async/ESPAsyncWebServer @ 3.12.0
	ESP32Async/AsyncTCP @ 3.5.0
	adafruit/Adafruit NeoPixel @ 1.15.5
build_flags = 
	-Wno-deprecated-declarations
	-DFASTBEE_ENABLE_MQTT=1
	-DFASTBEE_ENABLE_MDNS=1
	-DFASTBEE_ENABLE_AP_MODE=1
	-DFASTBEE_ENABLE_WEB_SERVER=1
	-DFASTBEE_ENABLE_WEB_STATIC=1
	-DFASTBEE_ENABLE_WEB_API=1
	-DFASTBEE_ENABLE_AUTH=1
	-DFASTBEE_ENABLE_SESSION=1
	-DFASTBEE_ENABLE_TASK_MANAGER=1
	-DFASTBEE_ENABLE_HEALTH_MONITOR=1
	-DFASTBEE_ENABLE_LOGGER=1
	-DFASTBEE_ENABLE_PERIPH_EXEC=1
	-DFASTBEE_ENABLE_GPIO=1
	-DFASTBEE_ENABLE_DNS=1
	-DFASTBEE_ENABLE_COMMAND_SCRIPT=1
	-DFASTBEE_LOG_BUFFER_SIZE=256
	-DFASTBEE_JSON_DOC_SIZE=8192
	; ESPAsyncWebServer uses #ifdef: defining this as 0 still enables regex.
	-UASYNCWEBSERVER_REGEX
	-DNDEBUG

[all_src_filter]
build_src_filter = +<*>

[all_ota_src_filter]
build_src_filter = +<*>

[unified_flags]
build_flags = 
	-DFASTBEE_ENABLE_SCREEN_PANEL=1
	-DFASTBEE_ENABLE_SCREEN_UI=1
	-DFASTBEE_ENABLE_POINT_HISTORY=1
	-DFASTBEE_ENABLE_REMOTE_RESOURCES=1
	-DFASTBEE_ENABLE_SENSOR_DRIVER=1
	-DFASTBEE_ENABLE_DS18B20=1
	-DFASTBEE_ENABLE_MODBUS=1
	-DFASTBEE_ENABLE_LCD=1
	-DFASTBEE_ENABLE_LCD_GB2312=1
	-DFASTBEE_ENABLE_NEOPIXEL=1
	-DFASTBEE_ENABLE_SEVEN_SEGMENT=1
	-DFASTBEE_ENABLE_RFID=1
	-DFASTBEE_ENABLE_I2C_SENSORS=1
	-DFASTBEE_ENABLE_IO_EXPANDER=1
	-DFASTBEE_ENABLE_IR_REMOTE=1
	-DFASTBEE_ENABLE_RF_LEARN=1
	-DFASTBEE_ENABLE_DS1302=1
	-DFASTBEE_ENABLE_LCD1602=1
	-DFASTBEE_MODBUS_SLAVE_ENABLE=0
	-DFASTBEE_ENABLE_RULE_SCRIPT=1
	-DFASTBEE_ENABLE_COMMAND_SCRIPT=1
	-DFASTBEE_ENABLE_DEVICE_CONTROL=1
	-DFASTBEE_ENABLE_USER_ADMIN=1
	-DFASTBEE_SINGLE_ADMIN_MODE=0
	-DFASTBEE_ENABLE_FILE_MANAGER=0
	-DFASTBEE_ENABLE_LOG_VIEWER=1
	-DFASTBEE_ENABLE_FILE_LOGGING=1
	-DFASTBEE_ENABLE_CONFIG_TRANSFER=1
	-DFASTBEE_ENABLE_BLE=0
	; Ethernet and cellular are selected per hardware environment below.
	; Keeping them out of the shared baseline prevents accidental linkage on
	; memory-constrained boards.
	-DFASTBEE_ENABLE_I18N=1

	-DFASTBEE_WEB_START_EARLY=1
	-DFASTBEE_ENABLE_STORAGE_CACHE=0
	-DFASTBEE_STRIP_INFO_LOGS=1
	-DFASTBEE_DEBUG_LOG=0
	-DFASTBEE_VERBOSE_ERROR=0
	-DCORE_DEBUG_LEVEL=1
	-UASYNCWEBSERVER_REGEX

[wifi_only_src_filter]
build_src_filter = 
	+<*>
	-<network/CellularAdapter.cpp>
	-<network/EthernetAdapter.cpp>

[esp32_runtime_flags]
build_flags = 
	-DCONFIG_ASYNC_TCP_MAX_CONNECTIONS=6
	-DCONFIG_ASYNC_TCP_QUEUE_SIZE=32
	-DARDUINO_LOOP_STACK_SIZE=16384
	-DCONFIG_ASYNC_TCP_TASK_WDT_TIMEOUT=10
	-DSCRIPT_TASK_STACK=8192
	-DSIMPLE_TASK_STACK=6144

; The classic ESP32-F4R0 has no PSRAM and shares its internal DRAM with
; WiFi/lwIP, the Web server, MQTT and peripheral execution. Keep the
; hardware-specific stack and queue limits for this target so a normal login
; does not start below the Web reserve. This is one firmware architecture,
; not a separate product edition.
[esp32_classic_runtime_flags]
build_flags =
	-DCONFIG_ASYNC_TCP_MAX_CONNECTIONS=4
	-DCONFIG_ASYNC_TCP_QUEUE_SIZE=8
	-DARDUINO_LOOP_STACK_SIZE=12288
	-DCONFIG_ASYNC_TCP_TASK_WDT_TIMEOUT=10
	-DSCRIPT_TASK_STACK=6144
	-DSIMPLE_TASK_STACK=4096

[esp32c3_runtime_flags]
build_flags = 
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCONFIG_ASYNC_TCP_MAX_CONNECTIONS=4
	-DCONFIG_ASYNC_TCP_QUEUE_SIZE=4
	-DARDUINO_LOOP_STACK_SIZE=12288
	-DCONFIG_ASYNC_TCP_TASK_WDT_TIMEOUT=10
	-DSCRIPT_TASK_STACK=6144
	-DSIMPLE_TASK_STACK=4096

[esp32c6_runtime_flags]
build_flags = 
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DCONFIG_ASYNC_TCP_MAX_CONNECTIONS=6
	-DCONFIG_ASYNC_TCP_QUEUE_SIZE=8
	-DCONFIG_ASYNC_TCP_MAX_ACK_TIME=10000
	-DARDUINO_LOOP_STACK_SIZE=12288
	-DCONFIG_ASYNC_TCP_TASK_WDT_TIMEOUT=10
	-DSCRIPT_TASK_STACK=6144
	-DSIMPLE_TASK_STACK=4096

[esp32s3_runtime_flags]
build_flags = 
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCONFIG_ASYNC_TCP_MAX_CONNECTIONS=8
	-DCONFIG_ASYNC_TCP_QUEUE_SIZE=24
	-DARDUINO_LOOP_STACK_SIZE=16384
	-DCONFIG_ASYNC_TCP_TASK_WDT_TIMEOUT=10
	-DSCRIPT_TASK_STACK=8192
	-DSIMPLE_TASK_STACK=6144

[env:esp32-F4R0]
platform = ${esp32_base.platform}
framework = ${esp32_base.framework}
board = esp32dev
board_build.mcu = esp32
build_type = ${esp32_base.build_type}
board_build.filesystem = ${esp32_base.board_build.filesystem}
board_build.partitions = partitions/4MB.csv
extra_scripts = ${esp32_base.extra_scripts}
upload_port = COM16
monitor_port = COM16
lib_deps =
	${esp32_base.lib_deps}
	adafruit/Adafruit BMP280 Library@^2.6.8
	adafruit/Adafruit MPU6050@^2.2.6
	miguelbalboa/MFRC522@^1.4.11
    crankyoldgit/IRremoteESP8266 @ 2.9.0
lib_ignore = NimBLE-Arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = direct
; The 4 MB classic target keeps generic I2C/IO and its existing network/UI
; features. Optional panel and remote-resource packages exceed its app slot.
build_unflags =
	-DFASTBEE_ENABLE_SCREEN_PANEL=1
	-DFASTBEE_ENABLE_SCREEN_UI=1
	-DFASTBEE_ENABLE_REMOTE_RESOURCES=1
build_flags = 
	${esp32_base.build_flags}
	${esp32_classic_runtime_flags.build_flags}
	${unified_flags.build_flags}
	-DFASTBEE_USE_PSRAM=0
	-DFASTBEE_ENABLE_OTA=0
	-DFASTBEE_ENABLE_OTA_FS=0
	-DFASTBEE_ENABLE_ETHERNET=0
	-DFASTBEE_ENABLE_CELLULAR=0
	-DFASTBEE_ENABLE_SCREEN_PANEL=0
	-DFASTBEE_ENABLE_SCREEN_UI=0
	-DFASTBEE_ENABLE_REMOTE_RESOURCES=0
build_src_filter = ${wifi_only_src_filter.build_src_filter}

