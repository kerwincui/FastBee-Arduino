	-DFASTBEE_ENABLE_CELLULAR=1
	-DFASTBEE_ENABLE_SCREEN_PANEL=0
	-DFASTBEE_ENABLE_SCREEN_UI=0
build_src_filter = ${all_ota_src_filter.build_src_filter}

