	-DFASTBEE_ENABLE_SCREEN_PANEL=1
	-DFASTBEE_ENABLE_SCREEN_UI=1
	-DFASTBEE_ENABLE_POINT_HISTORY=1
	-DFASTBEE_ENABLE_REMOTE_RESOURCES=1
build_flags = 
	${esp32_base.build_flags}
	${esp32c3_runtime_flags.build_flags}
	${unified_flags.build_flags}
	-DFASTBEE_USE_PSRAM=0
	-DFASTBEE_ENABLE_OTA=0
	-DFASTBEE_ENABLE_OTA_FS=0
	-DFASTBEE_ENABLE_ETHERNET=0
	-DFASTBEE_ENABLE_CELLULAR=0
	-DFASTBEE_ENABLE_SCREEN_PANEL=0
	-DFASTBEE_ENABLE_SCREEN_UI=0
	-DFASTBEE_ENABLE_POINT_HISTORY=0
	-DFASTBEE_ENABLE_REMOTE_RESOURCES=0
build_src_filter =
	${wifi_only_src_filter.build_src_filter}
	-<core/PointHistory.cpp>

